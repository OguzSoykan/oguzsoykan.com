<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sayfa bulunamadı · Oğuz Soykan</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f2;
        --ink: #141613;
        --muted: #565a53;
        --accent: #2041c9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0e0c;
          --ink: #eceee8;
          --muted: #a7aca2;
          --accent: #93a6ff;
        }
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(56px, 12vw, 120px);
        letter-spacing: -0.05em;
        line-height: 1;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Aradığın sayfa burada değil. · This page doesn’t exist.</p>
      <p>
        <a href="/">oguzsoykan.com</a> ·
        <a href="https://workflow.oguzsoykan.com/">Workflow Builder</a>
      </p>
    </main>
  </body>
</html>
